[project]
name = "collective-alpha"
version = "0.1.0"
description = "Equity alpha research platform: data ingestion, signal research, backtesting and systematic trading for an individual investor."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "massive>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.10",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.scripts]
ca = "collective_alpha.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "mypy>=1.11",
    "nbstripout>=0.7",
    "plotly>=5.24",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collective_alpha"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
