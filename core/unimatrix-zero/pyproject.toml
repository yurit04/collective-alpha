[project]
name = "unimatrix-zero"
version = "0.1.0"
description = "Point-in-time backtests: daily total returns linked across successors with delisting exits, portfolio builders, a daily engine with execution lag, spread/commission/impact/borrow costs, and performance analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "vinculum",
    "neural-processor",
    "polars>=1.20",
]

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
vinculum = { workspace = true }
neural-processor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unimatrix_zero"]
