[project]
name = "tactical-cube"
version = "0.1.0"
description = "Intraday backtests on nanoprobe-array bars: decisions at bar ends, fills a set number of bars later (VWAP, open, close or the official auctions), participation caps, flat-by times or overnight holds, intraday costs and a look-ahead check."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nanoprobe-array",
    "unimatrix-zero",
    "vinculum",
    "numpy>=1.26",
    "polars>=1.20",
]

[tool.uv.sources]
nanoprobe-array = { workspace = true }
unimatrix-zero = { workspace = true }
vinculum = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactical_cube"]
