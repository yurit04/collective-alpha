[project]
name = "adaptation-matrix"
version = "0.1.0"
description = "Transaction costs measured from Massive trades and NBBO quotes: spreads, realized spread and price impact, auctions, minute quotes and matched trades, kept after the raw ticks are gone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "vinculum",
    "unimatrix-zero",
    "numpy>=1.26",
    "polars>=1.20",
    "pyarrow>=18",
    "typer>=0.12",
]

[project.scripts]
adapt = "adaptation_matrix.cli:app"

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
vinculum = { workspace = true }
unimatrix-zero = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptation_matrix"]
