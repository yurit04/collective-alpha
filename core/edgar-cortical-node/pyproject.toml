[project]
name = "edgar-cortical-node"
version = "0.1.0"
description = "SEC EDGAR XBRL company facts: every filing kept with its filing date, point-in-time fundamentals and share counts by CIK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.10",
    "polars>=1.20",
    "pyarrow>=18",
    "typer>=0.12",
]

[project.scripts]
cortical = "edgar_cortical_node.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_cortical_node"]
