[project]
name = "transwarp-conduit"
version = "0.1.0"
description = "Execution through Interactive Brokers: account and positions, security-to-contract mapping, order sheets from target weights with limits, market-on-close orders (paper first), an order and fill journal, reconciliation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "unimatrix-zero",
    "ib_async>=2.0",
    "polars>=1.20",
    "typer>=0.12",
]

[project.scripts]
conduit = "transwarp_conduit.cli:app"

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
unimatrix-zero = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transwarp_conduit"]
