[project]
name = "vinculum"
version = "0.1.0"
description = "Joins Massive securities to SEC EDGAR companies: validated CIKs, split-aware share counts, daily market cap, size universes and point-in-time fundamentals per security."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "edgar-cortical-node",
    "polars>=1.20",
    "pyarrow>=18",
    "typer>=0.12",
]

[project.scripts]
vinculum = "vinculum.cli:app"

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
edgar-cortical-node = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinculum"]
