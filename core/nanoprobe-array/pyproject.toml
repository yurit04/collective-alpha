[project]
name = "nanoprobe-array"
version = "0.1.0"
description = "Intraday bars and features from Massive minute bars: a session clock, resampled bars with explicit gap rules, auction prices, per-bar features and a store of daily intraday summaries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "vinculum",
    "polars>=1.20",
    "typer>=0.12",
]

[project.scripts]
nanoprobe = "nanoprobe_array.cli:app"

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
vinculum = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoprobe_array"]
