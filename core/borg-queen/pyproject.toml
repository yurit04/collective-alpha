[project]
name = "borg-queen"
version = "0.1.0"
description = "Risk and portfolio construction: a point-in-time factor risk model (market, sectors, styles) over vinculum universes; later a cost-aware optimizer feeding unimatrix-zero."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "vinculum",
    "neural-processor",
    "unimatrix-zero",
    "cvxpy>=1.5",
    "numpy>=1.26",
    "polars>=1.20",
    "typer>=0.12",
]

[project.scripts]
queen = "borg_queen.cli:app"

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
vinculum = { workspace = true }
neural-processor = { workspace = true }
unimatrix-zero = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/borg_queen"]
