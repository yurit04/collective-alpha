[project]
name = "finra-sensor-array"
version = "0.1.0"
description = "FINRA short interest and daily short sale volume: free public data, stored as Parquet with publication dates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "polars>=1.20",
    "pyarrow>=18",
    "typer>=0.12",
]

[project.scripts]
sensor = "finra_sensor_array.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finra_sensor_array"]
