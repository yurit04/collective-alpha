[project]
name = "massive-subspace-stream"
version = "0.1.0"
description = "Massive (formerly Polygon.io) US equity data acquisition: flat-file backfill, REST datasets, live websocket stream, and pandas/polars queries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "orjson>=3.10",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=18",
    "typer>=0.12",
    "websockets>=14",
]

[project.scripts]
subspace = "massive_subspace_stream.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massive_subspace_stream"]
