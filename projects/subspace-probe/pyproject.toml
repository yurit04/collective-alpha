[project]
name = "subspace-probe"
version = "0.1.0"
description = "Exploratory data analysis of every data source in the collective (notebooks by source)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "edgar-cortical-node",
    "vinculum",
    "finra-sensor-array",
    "neural-processor",
    "unimatrix-zero",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
]

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
edgar-cortical-node = { workspace = true }
vinculum = { workspace = true }
finra-sensor-array = { workspace = true }
neural-processor = { workspace = true }
unimatrix-zero = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subspace_probe"]
