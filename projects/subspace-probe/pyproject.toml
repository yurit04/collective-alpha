[project]
name = "subspace-probe"
version = "0.1.0"
description = "Demo notebooks for every core module of the collective, one folder per module, following the dependency graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "edgar-cortical-node",
    "vinculum",
    "finra-sensor-array",
    "neural-processor",
    "unimatrix-zero",
    "borg-queen",
    "transwarp-conduit",
    "unicomplex",
    "nanoprobe-array",
    "tactical-cube",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
]

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
edgar-cortical-node = { workspace = true }
vinculum = { workspace = true }
finra-sensor-array = { workspace = true }
neural-processor = { workspace = true }
unimatrix-zero = { workspace = true }
borg-queen = { workspace = true }
transwarp-conduit = { workspace = true }
unicomplex = { workspace = true }
nanoprobe-array = { workspace = true }
tactical-cube = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subspace_probe"]
