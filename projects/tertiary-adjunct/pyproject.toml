[project]
name = "tertiary-adjunct"
version = "0.1.0"
description = "A twice-monthly cross-sectional equity strategy at $100k, long-short and long-only against SPY, under a protocol written before the results; candidates go to paper trading through transwarp-conduit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "massive-subspace-stream",
    "vinculum",
    "neural-processor",
    "unimatrix-zero",
    "borg-queen",
    "transwarp-conduit",
    "polars>=1.20",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
]

[tool.uv.sources]
massive-subspace-stream = { workspace = true }
vinculum = { workspace = true }
neural-processor = { workspace = true }
unimatrix-zero = { workspace = true }
borg-queen = { workspace = true }
transwarp-conduit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tertiary_adjunct"]
